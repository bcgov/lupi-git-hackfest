<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="600" viewBox="0 0 1400 600" role="img" aria-labelledby="title" preserveAspectRatio="xMidYMid meet">
  <title id="title">Green Chipchenko shoves the correct geometry back into place</title>
  <defs>
    <linearGradient id="g1" x1="0" x2="1">
      <stop offset="0" stop-color="#08172b"/>
      <stop offset="1" stop-color="#184060"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" x2="1">
      <stop offset="0" stop-color="#f8ffec"/>
      <stop offset="1" stop-color="#d6f0d1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#g1)" />

  <!-- Portal shards (fading) -->
  <g fill-opacity="0.75" stroke="none">
    <g transform="translate(1020,180) rotate(-10)">
      <path d="M0,-2 L18,-18 L28,-6 L12,14 z" fill="#e6a3ff" opacity="0.45"/>
      <path d="M10,10 L30,-8 L44,4 L24,26 z" fill="#d19bff" opacity="0.35"/>
      <circle cx="36" cy="-3" r="6" fill="#ffd2e6" opacity="0.4"/>
    </g>
    <g transform="translate(1070,230) rotate(30)">
      <path d="M0,0 L14,-18 L36,-3 L16,22 z" fill="#ffa8b8" opacity="0.3"/>
      <path d="M6,18 L28,4 L40,20 L18,36 z" fill="#ff8b6a" opacity="0.22"/>
    </g>
  </g>

  <!-- The hand-crafted map glowing -->
  <g transform="translate(320,280)">
    <rect x="-120" y="-78" rx="8" ry="8" width="240" height="156" fill="url(#g2)" stroke="#4b7a56" stroke-width="3" filter="url(#shadow)"/>
    <g stroke="#4b7a56" stroke-width="1.5" fill="none" transform="translate(-105,-58)">
      <!-- hand-drawn rivers -->
      <path d="M12,100 C40,80 80,88 112,52" stroke="#3a6b49" stroke-width="3"/> 
      <path d="M8,18 C44,28 86,12 120,32" stroke="#2b5a3a" stroke-width="2"/>
      <!-- annotation cross mark -->
      <g transform="translate(48,60)">
        <circle cx="0" cy="0" r="7" fill="#fff" stroke="#d14e36" stroke-width="2"/>
        <line x1="-10" y1="-10" x2="10" y2="10" stroke="#d14e36" stroke-width="2"/>
      </g>
      <!-- faint boundaries/grid -->
      <g stroke="#7ea884" opacity="0.6">
        <path d="M0,140 L240,140"/>
        <path d="M0,70 L240,70"/>
        <path d="M60,0 L60,156"/>
        <path d="M120,0 L120,156"/>
      </g>
    </g>
  </g>

  <!-- Hero silhouette --><g transform="translate(460,320) scale(1.05)">
    <g transform="translate(-40,-40)">
      <path d="M14,86 C20,68 28,56 30,44 C34,24 46,24 62,20 C76,16 94,20 102,34 C112,52 108,68 102,84 C94,108 74,126 54,130 C36,134 22,114 14,86 Z" fill="#062926" opacity="0.98"/>
      <!-- arm and map hold -->
      <path d="M86,46 C112,40 150,36 182,22 C206,12 220,6 230,14 C238,22 222,44 204,56 C184,70 148,82 110,86" fill="#1b3b2f" opacity="0.95"/>
      <path d="M120,36 L210,10 L270,86 L204,112 L120,36" fill="#fff2c7" opacity="0.9" stroke="#6b4f21" stroke-width="3"/>
      <!-- map title text (inside svg) -->
      <g font-family="sans-serif" font-size="10" fill="#274028" transform="translate(138,42)">
        <text x="0" y="0">THE WORLD</text>
        <text x="0" y="12">AS IT SHOULD BE</text>
      </g>
    </g>
  </g>

  <!-- Gridlines cutting the sky -->
  <g stroke="#9bd6ff" stroke-opacity="0.28" stroke-width="1">
    <path d="M160,50 L160,560"/>
    <path d="M320,50 L320,560"/>
    <path d="M480,50 L480,560"/>
    <path d="M640,50 L640,560"/>
    <path d="M800,50 L800,560"/>
    <path d="M960,50 L960,560"/>
    <path d="M1120,50 L1120,560"/>
  </g>

  <!-- Ground and title -->
  <g transform="translate(0,480)">
    <rect x="0" y="0" width="100%" height="120" fill="rgba(0,0,0,0.15)" />
    <g font-family="Georgia, serif" font-size="28" fill="#e9fbe7" font-weight="600" transform="translate(90,38)">
      <text>Silence returned.</text>
    </g>
  </g>

  <!-- small caption at bottom right -->
  <g transform="translate(1100,540)">
    <rect x="-8" y="-28" rx="6" ry="6" width="260" height="40" fill="#0e2433" opacity="0.42"/>
    <text x="0" y="0" font-size="12" font-family="Verdana, sans-serif" fill="#d7eef3">Green Chipchenko — The Last Stand</text>
  </g>
</svg>
